<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bird.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Editorial type: Inter (sans) + Source Serif 4 (headlines/prose) + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Daily AI Bird — Today's AI News in Five Minutes</title>
    <meta name="description" content="Cut through the AI hype. Every morning: the AI stories that actually matter, summarised in plain language and reviewed by humans. No ads, no clickbait." />
    <link rel="canonical" href="https://dailyaibird.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daily AI Bird — Today's AI News in Five Minutes" />
    <meta property="og:description" content="The AI stories that actually matter, in plain language. Curated by AI, reviewed by humans — for everyone interested in AI, not just developers." />
    <meta property="og:url" content="https://dailyaibird.com/" />
    <meta property="og:site_name" content="Daily AI Bird" />
    <meta property="og:image" content="/bird-og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily AI Bird — Today's AI News in Five Minutes" />
    <meta name="twitter:description" content="The AI stories that actually matter, in plain language. Curated by AI, reviewed by humans." />
    <meta name="twitter:image" content="/bird-og.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://dailyaibird.com/#organization",
          "name": "Daily AI Bird",
          "url": "https://dailyaibird.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://dailyaibird.com/bird-og.png"
          },
          "description": "Daily AI news for everyone — curated by AI, reviewed by humans. The stories that matter, summarised in plain language.",
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://dailyaibird.com/#website",
          "name": "Daily AI Bird",
          "url": "https://dailyaibird.com",
          "publisher": {
            "@id": "https://dailyaibird.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://dailyaibird.com/?topic={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
